name: 트러블슈팅 제보
description: 개발하며 겪은 문제를 남깁니다. 원인을 몰라도 괜찮습니다.
title: "[트러블슈팅] "
labels: ["troubleshooting"]
body:
  - type: dropdown
    id: area
    attributes:
      label: 분야
      options:
        - 하드웨어 (엔드이펙터, 출력, 조립)
        - 학습 구조 (텔레옵, 데이터, ACT)
        - 시뮬레이션과 비전
        - CAD와 도구
        - 기타
    validations:
      required: true
  - type: textarea
    id: symptom
    attributes:
      label: 증상
      description: 무엇을 봤나요? 사진이나 영상이 있으면 끌어다 놓아 주세요.
    validations:
      required: true
  - type: textarea
    id: cause
    attributes:
      label: 원인
      description: 왜 그랬는지 아는 만큼 적어 주세요. 모르면 비워 두세요.
  - type: textarea
    id: fix
    attributes:
      label: 조치
      description: 무엇을 바꿨나요? 파일 이름이나 값이 있으면 같이 적어 주세요.
  - type: textarea
    id: check
    attributes:
      label: 검증
      description: 어떻게 확인했나요?
  - type: textarea
    id: next
    attributes:
      label: 남은 일
      description: 아직 남은 문제가 있으면 적어 주세요.
  - type: dropdown
    id: status
    attributes:
      label: 상태
      options:
        - 해결
        - 진행 중
        - 보류
        - 확인 필요
    validations:
      required: true
