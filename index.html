<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>7축 용접 로봇 | 2026 IRC 지능로봇대회</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  body { font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; }

  /* 16:9 무대를 화면에 맞춰 통째로 축소 */
  .stage {
    position: absolute; left: 50%; top: 50%;
    width: min(100vw, calc(100vh * 16 / 9));
    aspect-ratio: 16 / 9;
    transform: translate(-50%, -50%);
    background: #fff;
  }
  .slide {
    position: absolute; inset: 0; width: 100%; height: 100%;
    visibility: hidden; opacity: 0; transition: opacity .25s;
    user-select: none; -webkit-user-drag: none;
  }
  .slide.active { visibility: visible; opacity: 1; }

  .bar {
    position: fixed; right: 14px; bottom: 10px;
    color: #bbb; font-size: 13px; display: flex; gap: 10px; align-items: center;
    opacity: 0; transition: opacity .3s;
  }
  body:hover .bar, .bar:focus-within { opacity: 1; }
  .bar button {
    background: #222; color: #ddd; border: 1px solid #444; border-radius: 4px;
    padding: 4px 10px; font-size: 13px; cursor: pointer;
  }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  @media (prefers-reduced-motion: reduce) { .slide { transition: none; } }
</style>
</head>
<body>
<main class="stage" id="stage">
  <img class="slide" src="deck/final/01.png" alt="2026 IRC 지능로봇대회 매니퓰레이터 종목. 제조 디지털 전환(DX) 7축 용접 로봇. 손태산, 김광빈, 김동희, 왕혜영">
  <img class="slide" src="deck/final/02.png" alt="목차" loading="lazy">
  <img class="slide" src="deck/final/03.png" alt="1. 프로젝트 개요" loading="lazy">
  <img class="slide" src="deck/final/04.png" alt="2. 프로젝트 수행 배경" loading="lazy">
  <img class="slide" src="deck/final/05.png" alt="3. 프로젝트 수행 필요성" loading="lazy">
  <img class="slide" src="deck/final/06.png" alt="4. 개발 목표 및 차별성" loading="lazy">
  <img class="slide" src="deck/final/07.png" alt="5. 개발 대상 및 자율 작업 시나리오" loading="lazy">
  <img class="slide" src="deck/final/08.png" alt="6. 시스템 구성 및 하드웨어 설계: 자율용접 로봇 시스템 아키텍처" loading="lazy">
  <img class="slide" src="deck/final/09.png" alt="6. 시스템 구성 및 하드웨어 설계: 하드웨어 설계. 매니퓰레이터, 엔드이펙터, 레이저 모듈, 레이저 ON/OFF, 카메라" loading="lazy">
  <img class="slide" src="deck/final/10.png" alt="7. 실시간 작업 모니터링: 웹 대시보드로 보는 영상과 로봇 상태" loading="lazy">
  <img class="slide" src="deck/final/11.png" alt="8. ACT 기반 모방학습 및 자율 제어: 시연, 기록, ACT 학습, 자율 실행" loading="lazy">
  <img class="slide" src="deck/final/12.png" alt="9. 자율 용접 시연: 임의 배치 시편 자율용접 시연과 확인 항목" loading="lazy">
  <img class="slide" src="deck/final/13.png" alt="10. 결론 및 향후 과제" loading="lazy">
  <img class="slide" src="deck/final/14.png" alt="10. 결론 및 향후 과제: 한계점과 향후 과제" loading="lazy">
</main>

<div class="bar">
  <button id="prev" aria-label="이전 장">이전</button>
  <span id="count" aria-live="polite"></span>
  <button id="next" aria-label="다음 장">다음</button>
  <button id="full" aria-label="전체 화면">전체 화면</button>
</div>

<script>
  const slides = [...document.querySelectorAll('.slide')];
  const count = document.getElementById('count');
  let cur = 0;

  function show(i) {
    cur = Math.max(0, Math.min(slides.length - 1, i));
    slides.forEach((s, k) => s.classList.toggle('active', k === cur));
    count.textContent = (cur + 1) + ' / ' + slides.length;
    history.replaceState(null, '', '#' + (cur + 1));
    // 다음 장 이미지를 미리 받아 둠
    const nx = slides[cur + 1];
    if (nx) nx.loading = 'eager';
  }

  function fromHash() {
    const n = parseInt(location.hash.slice(1), 10);
    return Number.isFinite(n) ? n - 1 : 0;
  }

  document.addEventListener('keydown', e => {
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); show(cur + 1); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); show(cur - 1); }
    else if (e.key === 'Home') show(0);
    else if (e.key === 'End') show(slides.length - 1);
    else if (e.key === 'f' || e.key === 'F') toggleFull();
  });

  let wheelLock = false;
  document.addEventListener('wheel', e => {
    if (wheelLock || Math.abs(e.deltaY) < 20) return;
    wheelLock = true; setTimeout(() => wheelLock = false, 500);
    show(cur + (e.deltaY > 0 ? 1 : -1));
  }, { passive: true });

  let tx = null;
  document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
  document.addEventListener('touchend', e => {
    if (tx === null) return;
    const dx = e.changedTouches[0].clientX - tx; tx = null;
    if (Math.abs(dx) > 40) show(cur + (dx < 0 ? 1 : -1));
  });

  // 화면 오른쪽 절반을 누르면 다음, 왼쪽 절반은 이전
  document.getElementById('stage').addEventListener('click', e => {
    show(cur + (e.clientX > innerWidth / 2 ? 1 : -1));
  });

  function toggleFull() {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.();
  }
  document.getElementById('prev').onclick = () => show(cur - 1);
  document.getElementById('next').onclick = () => show(cur + 1);
  document.getElementById('full').onclick = toggleFull;
  addEventListener('hashchange', () => { if (fromHash() !== cur) show(fromHash()); });

  show(fromHash());
</script>
</body>
</html>
