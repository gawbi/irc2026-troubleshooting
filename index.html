<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>6축 용접 로봇 | 2026 IRC 지능로봇대회</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  body { font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; }

  /* 16:9 무대를 화면에 맞춰 통째로 축소 */
  .stage {
    position: absolute; left: 50%; top: 50%;
    width: min(100vw, calc(100vh * 16 / 9));
    aspect-ratio: 16 / 9;
    transform: translate(-50%, -50%);
    background: #fff;
  }
  .slide {
    position: absolute; inset: 0; width: 100%; height: 100%;
    visibility: hidden; opacity: 0; transition: opacity .25s;
    user-select: none; -webkit-user-drag: none;
  }
  .slide.active { visibility: visible; opacity: 1; }
  div.slide > img { width: 100%; height: 100%; display: block; }
  .clip { position: absolute; object-fit: cover; background: #1F2633; }

  .bar {
    position: fixed; right: 14px; bottom: 10px;
    color: #bbb; font-size: 13px; display: flex; gap: 10px; align-items: center;
    opacity: 0; transition: opacity .3s;
  }
  body:hover .bar, .bar:focus-within { opacity: 1; }
  .bar button {
    background: #222; color: #ddd; border: 1px solid #444; border-radius: 4px;
    padding: 4px 10px; font-size: 13px; cursor: pointer;
  }
  .bar a.link { color: #ddd; text-decoration: none; border: 1px solid #444; border-radius: 4px; padding: 4px 10px; background: #222; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  @media (prefers-reduced-motion: reduce) { .slide { transition: none; } }
</style>
</head>
<body>
<main class="stage" id="stage">
  <img class="slide" src="deck/final/01.png" alt="2026 IRC 지능로봇대회 매니퓰레이터 종목. 제조 디지털 전환(DX) 6축 용접 로봇. 손태산, 김광빈, 김동희, 왕혜영">
  <img class="slide" src="deck/final/02.png" alt="목차" loading="lazy">
  <img class="slide" src="deck/final/03.png" alt="1. 프로젝트 개요. 6축 자율용접 로봇" loading="lazy">
  <img class="slide" src="deck/final/04.png" alt="2. 프로젝트 수행 배경: 숙련 기술의 단절과 기존 자동용접의 한계. 실내 철골 제작공장 자동용접 사진, 강교량 야외 건설현장 사진" loading="lazy">
  <img class="slide" src="deck/final/05.png" alt="3. 프로젝트 수행 필요성: 숙련 기술의 계승과 비정형 환경 대응을 위한 자율용접 기술의 필요성" loading="lazy">
  <div class="slide">
    <img src="deck/final/06.png" alt="4. 개발 목표 및 차별성: 룰 베이스를 넘어 숙련 행동 학습으로. OPTi3 용접로봇 전시 시연과 실제 아크 용접 영상, 기존 룰 베이스와 본 프로젝트 비교, 최종 개발 목표" loading="lazy">
    <!-- PPT 6장 영상 자리(x 60/468, y 270, 392×294pt / 1440×810pt)에 맞춰 올린 앞 6초 GIF -->
    <img class="clip" style="left:4.1667%; top:33.333%; width:27.222%; height:36.296%;" src="deck/img/opti3_demo.gif" alt="OPTi3 전시 시연 앞 6초" loading="lazy">
    <img class="clip" style="left:32.5%; top:33.333%; width:27.222%; height:36.296%;" src="deck/img/opti3_arc.gif" alt="OPTi3 실제 아크 용접 앞 6초" loading="lazy">
  </div>
  <img class="slide" src="deck/final/07.png" alt="5. 개발 대상 및 자율 작업 시나리오: 수평 접합선에 대응하는 자율용접 작업 구현. 3면 직각 시편과 T형 필릿 시편" loading="lazy">
  <img class="slide" src="deck/final/08.png" alt="6. 시스템 구성 및 하드웨어 설계: 자율용접 로봇 시스템 아키텍처" loading="lazy">
  <img class="slide" src="deck/final/09.png" alt="6. 시스템 구성 및 하드웨어 설계: 역할을 나눈 세 가지 AI. ACT 모방학습(제어), YOLO 용접선 검출(인식과 검증), 손 검출 인터록(안전)" loading="lazy">
  <img class="slide" src="deck/final/10.png" alt="6. 시스템 구성 및 하드웨어 설계: 하드웨어 설계. 레이저 일체형 엔드이펙터 실물 사진과 CAD, 매니퓰레이터, 엔드이펙터, 카메라, 개선 내용" loading="lazy">
  <img class="slide" src="deck/final/11.png" alt="6. 시스템 구성 및 하드웨어 설계: 직접 개선한 기술. 엔드이펙터 설계 변천 v1, v2, v3, 최종 레이저 일체형" loading="lazy">
  <img class="slide" src="deck/final/12.png" alt="7. 실시간 작업 모니터링: 웹 대시보드로 보는 영상과 로봇 상태" loading="lazy">
  <img class="slide" src="deck/final/13.png" alt="7. 실시간 작업 모니터링: YOLO 용접선 검출과 진행 표시, 성공 판정 기준" loading="lazy">
  <img class="slide" src="deck/final/14.png" alt="7. 실시간 작업 모니터링: YOLO 추론 최적화로 2.1배 가속. PyTorch에서 ONNX, TensorRT FP16 변환, 1회 추론 시간 중앙값 8.1 ms에서 3.8 ms, 정확도 유지, ACT 정책 변환 예정" loading="lazy">
  <img class="slide" src="deck/final/15.png" alt="8. ACT 기반 모방학습 및 자율 제어: 시연, 기록, ACT 학습, 자율 실행, ACT는 동작을 묶음으로 예측" loading="lazy">
  <img class="slide" src="deck/final/16.png" alt="9. 자율 용접 시연: 임의 배치 시편 자율용접 시연, 확인 항목, 시연 시편(T자 필릿, 3면 직각)" loading="lazy">
  <img class="slide" src="deck/final/17.png" alt="9. 자율 용접 시연: 시연 결과와 성공 기준" loading="lazy">
  <img class="slide" src="deck/final/18.png" alt="10. 결론 및 향후 과제" loading="lazy">
  <img class="slide" src="deck/final/19.png" alt="10. 결론 및 향후 과제: 한계점과 향후 과제, 홈페이지 QR 코드" loading="lazy">
</main>

<div class="bar">
  <button id="prev" aria-label="이전 장">이전</button>
  <span id="count" aria-live="polite"></span>
  <button id="next" aria-label="다음 장">다음</button>
  <button id="full" aria-label="전체 화면">전체 화면</button>
  <a class="link" href="project.html">프로젝트 자료</a>
</div>

<script>
  const slides = [...document.querySelectorAll('.slide')];
  const count = document.getElementById('count');
  let cur = 0;

  function show(i) {
    cur = Math.max(0, Math.min(slides.length - 1, i));
    slides.forEach((s, k) => s.classList.toggle('active', k === cur));
    count.textContent = (cur + 1) + ' / ' + slides.length;
    history.replaceState(null, '', '#' + (cur + 1));
    // 다음 장 이미지를 미리 받아 둠
    const nx = slides[cur + 1];
    if (nx) (nx.tagName === 'IMG' ? nx : nx.querySelector('img')).loading = 'eager';
    // 영상은 그 장이 보일 때만 재생
    slides.forEach((s, k) => s.querySelectorAll?.('video').forEach(v => {
      if (k === cur) v.play().catch(() => {}); else v.pause();
    }));
  }

  function fromHash() {
    const n = parseInt(location.hash.slice(1), 10);
    return Number.isFinite(n) ? n - 1 : 0;
  }

  document.addEventListener('keydown', e => {
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); show(cur + 1); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); show(cur - 1); }
    else if (e.key === 'Home') show(0);
    else if (e.key === 'End') show(slides.length - 1);
    else if (e.key === 'f' || e.key === 'F') toggleFull();
  });

  let wheelLock = false;
  document.addEventListener('wheel', e => {
    if (wheelLock || Math.abs(e.deltaY) < 20) return;
    wheelLock = true; setTimeout(() => wheelLock = false, 500);
    show(cur + (e.deltaY > 0 ? 1 : -1));
  }, { passive: true });

  let tx = null;
  document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
  document.addEventListener('touchend', e => {
    if (tx === null) return;
    const dx = e.changedTouches[0].clientX - tx; tx = null;
    if (Math.abs(dx) > 40) show(cur + (dx < 0 ? 1 : -1));
  });

  // 화면 오른쪽 절반을 누르면 다음, 왼쪽 절반은 이전
  document.getElementById('stage').addEventListener('click', e => {
    if (e.target.tagName === 'VIDEO') return;   // 영상 조작은 넘김으로 치지 않음
    show(cur + (e.clientX > innerWidth / 2 ? 1 : -1));
  });

  function toggleFull() {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.();
  }
  document.getElementById('prev').onclick = () => show(cur - 1);
  document.getElementById('next').onclick = () => show(cur + 1);
  document.getElementById('full').onclick = toggleFull;
  addEventListener('hashchange', () => { if (fromHash() !== cur) show(fromHash()); });

  show(fromHash());
</script>
</body>
</html>
